# ==============================================================================
# Sentinel Collector - Nginx Configuration Snippet
# ==============================================================================
#
# Include this configuration in your /etc/nginx/nginx.conf or /etc/nginx/conf.d/
# to ensure accurate client IP logging behind load balancers / reverse proxies
# and standard combined log formatting for the Sentinel Collector daemon.
#

# 1. Custom Log Format (or standard combined)
# Sentinel Collector parses standard 'combined' or the enhanced 'sentinel_combined' format.
log_format sentinel_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time uct="$upstream_connect_time"';

# 2. Real Client IP Resolution behind Proxies/Load Balancers (AWS ALB, Cloudflare, etc.)
# If your Nginx server is behind a reverse proxy or CDN, uncomment and configure
# the real_ip module so $remote_addr contains the genuine client IP address:
#
# set_real_ip_from 10.0.0.0/8;        # Internal VPC range
# set_real_ip_from 172.16.0.0/12;     # Docker / Private network
# set_real_ip_from 192.168.0.0/16;    # Local network
#
# For Cloudflare:
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# # ... (include cloudflare IP blocks)
#
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

# 3. Dedicated Access Log Directive
# Direct access logs for Sentinel to read:
# access_log /var/log/nginx/sentinel_access.log combined buffer=32k flush=1s;
